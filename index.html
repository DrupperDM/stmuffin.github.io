<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTARUNE</title>
    
    <!-- Importamos la fuente exacta de Undertale/Deltarune (Determination Sans) -->
    <link href="https://fonts.cdnfonts.com/css/determination-sans" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --select-yellow: #ffff00;
            --soul-red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Usamos la fuente original del juego */
            font-family: 'Determination Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            /* La fuente Determination se ve mejor sin forzar mayúsculas, 
               ya que tiene un diseño específico para altas y bajas */
        }

        /* Estilo de la caja de diálogo típica del juego */
        .dialog-box {
            max-width: 800px;
            width: 90%;
            background: var(--bg-color);
            border: 6px solid var(--text-color); /* Borde un poco más grueso */
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.15);
            animation: typeIn 0.8s steps(20, end);
            /* Suavizado de fuente desactivado para mantener el aspecto pixelado */
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        h1 {
            font-size: 5rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .asterisk {
            color: var(--text-color);
            margin-right: 10px;
        }

        .subtitle {
            font-size: 2rem; /* Aumentado porque Determination Sans es más compacta */
            margin-bottom: 3rem;
            line-height: 1.4;
            text-align: left; /* Alineado a la izquierda como en los diálogos del juego */
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .soul-text {
            color: var(--soul-red);
            display: block;
            margin-top: 15px;
            animation: pulse 2s infinite;
        }

        /* Contenedor de botones moderno (Flexbox) pero con diseño retro */
        .download-section {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Determination Sans', sans-serif;
            font-size: 2rem;
            text-decoration: none;
            padding: 1rem 2rem;
            border: 3px solid var(--text-color);
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
        }

        /* El corazón (alma) que aparece al pasar el cursor */
        .btn::before {
            content: '♥'; /* Corazón clásico */
            color: transparent;
            font-size: 1.8rem;
            transition: color 0.1s ease;
        }

        /* Efecto de selección idéntico al del juego */
        .btn:hover {
            border-color: var(--select-yellow);
            color: var(--select-yellow);
            box-shadow: 6px 6px 0px var(--select-yellow);
            transform: translate(-3px, -3px);
        }

        .btn:hover::before {
            color: var(--select-yellow);
        }

        footer {
            margin-top: 3rem;
            font-size: 1.2rem;
            text-align: center;
            opacity: 0.7;
            text-transform: uppercase;
        }

        footer a {
            color: var(--text-color);
            text-decoration: underline;
        }

        footer a:hover {
            color: var(--select-yellow);
        }

        /* Animaciones */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes typeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .subtitle { font-size: 1.5rem; }
            .btn { width: 100%; justify-content: center; }
            .dialog-box { border-width: 4px; padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="dialog-box">
        <h1>DELTARUNE</h1>
        
        <div class="subtitle">
            <p><span class="asterisk">*</span> Capítulos 1 y 2 ya disponibles.</p>
            <p class="soul-text"><span class="asterisk">*</span> El futuro está en tus manos.</p>
        </div>

        <div class="download-section">
            <a href="#" class="btn">Windows</a>
            <a href="#" class="btn">Mac OS</a>
        </div>
    </div>

    <footer>
        <p>DISEÑO REIMAGINADO. <br> <a href="https://deltarune.com" target="_blank">DELTARUNE.COM</a></p>
    </footer>

</body>
</html>
