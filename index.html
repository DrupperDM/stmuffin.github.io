<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTARUNE</title>
    
    <!-- Fuente de respaldo muy fiel al estilo Undertale/Deltarune -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    
    <style>
        /* Intentamos cargar la fuente original de la web de Deltarune */
        @font-face {
            font-family: '8bitoperator JVE';
            src: url('https://deltarune.com/assets/8bitoperator_jve.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --select-yellow: #ffff00;
            --soul-red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Priorizamos la fuente original, si no carga, usa el respaldo perfecto */
            font-family: '8bitoperator JVE', 'DotGothic16', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Estilo de la caja de diálogo típica del juego */
        .dialog-box {
            max-width: 800px;
            width: 90%;
            background: var(--bg-color);
            border: 4px solid var(--text-color);
            padding: 3rem 2rem;
            text-align: center;
            /* Toque moderno: una sombra sólida en bloque, no difuminada */
            box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.15);
            animation: typeIn 0.8s steps(20, end);
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            line-height: 1.5;
        }

        .soul-text {
            color: var(--soul-red);
            display: block;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        /* Contenedor de botones moderno (Flexbox) pero con diseño retro */
        .download-section {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 1.5rem;
            text-decoration: none;
            padding: 1rem 2rem;
            border: 2px solid var(--text-color);
            cursor: pointer;
            position: relative;
            /* Toque moderno: transición ultra rápida (crisp) */
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* El corazón (alma) que aparece al pasar el cursor */
        .btn::before {
            content: '❤';
            color: transparent;
            font-size: 1.2rem;
            transition: color 0.1s ease;
        }

        /* Efecto de selección idéntico al del juego */
        .btn:hover {
            border-color: var(--select-yellow);
            color: var(--select-yellow);
            /* Sombra en bloque para el hover */
            box-shadow: 4px 4px 0px var(--select-yellow);
            transform: translate(-2px, -2px);
        }

        .btn:hover::before {
            color: var(--select-yellow);
        }

        footer {
            margin-top: 3rem;
            font-size: 1rem;
            text-align: center;
            opacity: 0.7;
        }

        footer a {
            color: var(--text-color);
            text-decoration: underline;
        }

        footer a:hover {
            color: var(--select-yellow);
        }

        /* Animaciones */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes typeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .btn { width: 100%; justify-content: center; }
            .dialog-box { border-width: 2px; padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="dialog-box">
        <h1>TESTING</h1>
        <div class="subtitle">
            <p>Capítulos 1 y 2 ya disponibles.</p>
            <p class="soul-text">El futuro está en tus manos.</p>
        </div>

        <div class="download-section">
            <a href="#" class="btn">Windows</a>
            <a href="#" class="btn">Mac OS</a>
        </div>
    </div>

    <footer>
        <p>DISEÑO REIMAGINADO. <br> <a href="https://deltarune.com" target="_blank">DELTARUNE.COM</a></p>
    </footer>

</body>
</html>

</body>
</html>
