<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿MUFFIN?</title>
    <!-- Fuente pixelada para mantener la tipografía original -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --bg-light: #111111;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-red: #ff003c;
            --glow-red: rgba(255, 0, 60, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background: radial-gradient(circle at center, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Contenedor principal con estilo de tarjeta moderna pero oscura */
        .container {
            max-width: 800px;
            width: 90%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            animation: fadeIn 1.5s ease-out;
        }

        /* Título con efecto de resplandor */
        h1 {
            font-size: 5rem;
            letter-spacing: 10px;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        p.subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            letter-spacing: 2px;
        }

        /* Contenedor de botones modernos */
        .download-section {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Botones modernizados con tipografía retro */
        .btn {
            background: transparent;
            color: var(--text-main);
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border: 2px solid var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--text-main);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Botón destacado (Estilo "Alma" de Deltarune) */
        .btn-primary {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .btn-primary:hover {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 0 25px var(--glow-red);
        }

        /* Pie de página */
        footer {
            margin-top: 4rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--text-muted);
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--text-main);
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsivo para móviles */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; letter-spacing: 5px; }
            .container { padding: 2rem 1rem; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PAGINA WEB TEST</h1>
        <p class="subtitle">UN JUEGO PARA TI.</p>

        <div class="download-section">
            <a href="#" class="btn btn-primary">DESCARGAR (WINDOWS)</a>
            <a href="#" class="btn">DESCARGAR (MAC)</a>
        </div>
    </div>

    <footer>
        <p>Una reimaginación moderna. <br> <a href="https://deltarune.com" target="_blank">Sitio original aquí</a>.</p>
    </footer>

</body>
</html>
